# Phase 0 baseline configuration - BIRD mini-dev by default (see configs/full_dev.yaml for full dev).

project:
  name: bird-agent-coordination
  seed: 42

bird:
  split: mini_dev
  root: data/bird/mini_dev
  tasks_json: data/bird/mini_dev/mini_dev_sqlite.json
  databases_dir: data/bird/mini_dev/dev_databases
  subset_file: ""
  subset_limit: 50

use_evidence: true

# Prune schema context to tables matched from question+evidence (+ FK neighbors).
schema_pruning: false
# keyword | semantic (TF-IDF on column descriptions) | hybrid (50/50 blend)
schema_pruning_mode: keyword
schema_pruning_semantic_min_score: 0.05

# Persistent per-database profile card (Chapter 12). Requires the prompt-cache loop;
# artifacts are built offline by scripts/build_db_profile.py into profiles_dir.
db_profile: false
profiles_dir: data/profiles
db_profile_char_budget: 1500

# P4 structural explore suppression (Chapter 13). Requires the prompt-cache loop.
explore_suppressor: false
explore_suppressor_max_suppressions: 64

semantic_store:
  max_entries: 128
  max_inject_chars: 500
  max_inject_bullets: 8

llm:
  models_config: configs/models.yaml
  default: gpt-4o-mini
  # Thesis evaluation matrix (plan: 2+ LLMs); all three for redundancy / cost experiments
  eval_models:
    - gpt-4o-mini
    - gemini-2.5-flash
    - deepseek-v3.2
  temperature: 0
  max_turns: 15
  budget_usd: 500
  # Back off on 503/429 (Gemini spikes); batch pause reduces burst rate limits
  retry_max_attempts: 6
  retry_base_delay_seconds: 2
  retry_max_delay_seconds: 60
  # Per-request HTTP read timeout; hung calls fail fast and use retry_max_* backoff
  request_timeout_seconds: 120
  batch_inter_task_delay_seconds: 1.5

coordination:
  sql_cache_max_entries: 4096
  discovery_max_fragments: 256
  # Replica schedule defaults (override via CLI on parallel batch scripts)
  temperature_mode: uniform   # uniform | ladder
  temperature_step: 0.2
  stagger_mode: none          # none | linear_seconds | linear_turns
  stagger_seconds: 0.0
  stagger_turns: 0
  stagger_poll_seconds: 1.0

database:
  engine: duckdb
  query_timeout_seconds: 30
  read_only: true
  max_result_rows: 100

logging:
  runs_dir: runs
  # Emit per-turn `llm_turn` events (prompt/completion/cached tokens) for
  # turn-by-turn cache curves. Cached input tokens are logged by CachedRunTrace.
  log_llm_messages: true
  experiment_tracker: none
