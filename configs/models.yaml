# Model registry for experiments. Keys are used in configs/default.yaml (llm.default, llm.eval_models).
#
# DeepSeek: V3.2 is served as deepseek-chat on the official API (OpenAI-compatible).
models:
  gpt-4o-mini:
    label: GPT-4o mini
    provider: openai
    api_model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  gemini-2.5-flash:
    label: Gemini 2.5 Flash
    provider: google
    api_model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY

  deepseek-v3.2:
    label: DeepSeek V3.2
    provider: deepseek
    api_model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
