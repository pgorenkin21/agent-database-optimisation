[project]
name = "bird-agent-coordination"
version = "0.1.0"
description = "Middleware coordination for multi-agent BIRD text-to-SQL workloads"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "duckdb==1.2.2",
    "openai==1.68.2",
    "google-genai==1.12.1",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "pandas==2.2.3",
    "numpy==2.2.3",
    "sqlglot==26.8.0",
    "wandb==0.19.8",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
managed = true
